name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev libgtk-layer-shell-dev libwayland-dev libwayland-bin libpulse-dev libasound2-dev librsvg2-dev

      - name: Read repository Rust toolchain
        id: rust
        shell: bash
        run: sed -n 's/^channel = "\(.*\)"/toolchain=\1/p' rust-toolchain.toml >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master (rust-toolchain.toml)
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2

      - name: Install shell dependencies
        working-directory: shell
        run: bun install --frozen-lockfile

      - name: Sync SDK environment
        working-directory: sdk/python
        run: uv sync --locked

      - name: Quality gates
        run: just check

      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  # Native Windows compile checks and app-unit tests; core integration tests
  # requiring a Linux session run in the other job.
  check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Read repository Rust toolchain
        id: rust
        shell: bash
        run: sed -n 's/^channel = "\(.*\)"/toolchain=\1/p' rust-toolchain.toml >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master (rust-toolchain.toml)
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Clippy (Windows)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Store variant (Windows)
        run: cargo clippy -p smabar --features no-self-update --all-targets --locked -- -D warnings
      - name: Windows platform and Store tests
        run: cargo test -p smabar --features no-self-update --locked
      - name: Store recovery regressions (Windows filesystem)
        run: cargo test -p smabar-core store::journal_tests --locked
